{{/*
Optional generated app secrets (manual provider only, opt-in via
manualSecret.generate.enabled). Lookup-guarded: if the secret already exists
in the release namespace, each existing key is reused verbatim, so
`helm upgrade` never rotates keys. FIELD_ENCRYPTION_KEY is generated as a
valid Fernet key (url-safe base64 of 32 bytes). No credential value ever
ships in values files.
*/}}
{{- if include "docsie.generatedSecretEnabled" . }}
{{- $name := include "docsie.generatedSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $existingData := dict }}
{{- if $existing }}
{{- $existingData = default (dict) $existing.data }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "docsie.labels" . | nindent 4 }}
  annotations:
    # Keep on uninstall: losing FIELD_ENCRYPTION_KEY makes encrypted DB
    # columns unreadable. Delete the secret manually for a true wipe.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- range $key := .Values.manualSecret.generate.keys }}
  {{- if hasKey $existingData $key }}
  {{ $key }}: {{ index $existingData $key }}
  {{- else if eq $key "FIELD_ENCRYPTION_KEY" }}
  {{- /* Value must be a Fernet key (url-safe base64 of 32 bytes); the outer
         b64enc is the Secret.data encoding of that key string. */}}
  {{ $key }}: {{ randAlphaNum 32 | b64enc | replace "+" "-" | replace "/" "_" | b64enc }}
  {{- else }}
  {{ $key }}: {{ randAlphaNum 48 | b64enc }}
  {{- end }}
  {{- end }}
{{- end }}
