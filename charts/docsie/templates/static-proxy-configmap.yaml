{{- if .Values.staticProxy.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "docsie.staticProxyName" . }}-nginx
  labels:
    {{- include "docsie.labels" . | nindent 4 }}
    app.kubernetes.io/component: static-proxy
data:
  default.conf: |
    proxy_cache_path /var/cache/nginx/docsie levels=1:2 keys_zone=docsie_cdn:{{ .Values.staticProxy.cache.keysZoneSize }} max_size={{ .Values.staticProxy.cache.maxSize }} inactive={{ .Values.staticProxy.cache.inactive }} use_temp_path=off;

    server {
      listen 8080;
      server_name _;

      gzip on;
      gzip_vary on;
      gzip_proxied any;
      gzip_comp_level {{ .Values.staticProxy.gzip.compLevel }};
      gzip_min_length {{ .Values.staticProxy.gzip.minLength }};
      gzip_types
        application/atom+xml
        application/javascript
        application/json
        application/manifest+json
        application/rss+xml
        application/vnd.ms-fontobject
        application/wasm
        application/x-font-ttf
        application/x-javascript
        application/xml
        font/opentype
        font/ttf
        font/woff
        font/woff2
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

      location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
      }

      location ~ ^{{ .Values.staticProxy.pathPrefix }}appcdn2/js/manager/.*/config\.json$ {
        proxy_pass {{ .Values.staticProxy.minioEndpoint }};
        proxy_http_version 1.1;
        proxy_set_header Host {{ .Values.staticProxy.upstreamHost }};
        proxy_set_header Connection "";

        proxy_buffering on;
        proxy_cache_bypass 1;
        proxy_no_cache 1;
        proxy_ignore_headers Set-Cookie;
        proxy_hide_header Set-Cookie;

        expires {{ .Values.staticProxy.configBrowserCache.expires }};
        add_header Cache-Control "{{ .Values.staticProxy.configBrowserCache.cacheControl }}" always;
        add_header X-Cache-Status "BYPASS" always;
      }

      location {{ .Values.staticProxy.pathPrefix }} {
        proxy_pass {{ .Values.staticProxy.minioEndpoint }};
        proxy_http_version 1.1;
        proxy_set_header Host {{ .Values.staticProxy.upstreamHost }};
        proxy_set_header Connection "";

        proxy_buffering on;
        proxy_cache docsie_cdn;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        proxy_cache_methods GET HEAD;
        proxy_cache_valid 200 301 302 {{ .Values.staticProxy.cache.valid }};
        proxy_cache_valid 404 {{ .Values.staticProxy.cache.notFoundValid }};
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_ignore_headers Set-Cookie;
        proxy_hide_header Set-Cookie;

        expires {{ .Values.staticProxy.browserCache.expires }};
        add_header Cache-Control "{{ .Values.staticProxy.browserCache.cacheControl }}" always;
        add_header X-Cache-Status $upstream_cache_status always;
      }

      {{- if .Values.staticProxy.s3Proxy.enabled }}
      {{- range .Values.staticProxy.s3Proxy.paths }}
      location {{ . }} {
        client_max_body_size {{ $.Values.staticProxy.s3Proxy.clientMaxBodySize }};
        client_body_timeout {{ $.Values.staticProxy.s3Proxy.clientBodyTimeout }};
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout {{ $.Values.staticProxy.s3Proxy.proxyConnectTimeout }};
        proxy_send_timeout {{ $.Values.staticProxy.s3Proxy.proxySendTimeout }};
        proxy_read_timeout {{ $.Values.staticProxy.s3Proxy.proxyReadTimeout }};
        proxy_pass {{ $.Values.staticProxy.minioEndpoint }};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
      }

      {{- end }}
      {{- end }}

      location / {
        return 404;
      }
    }
{{- end }}
