{{- if .Values.web.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: docsie-web
  labels:
    {{- include "docsie.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "docsie.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: web
{{- end }}
