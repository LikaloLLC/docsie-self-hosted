{{- if .Values.celery.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: docsie-celery
  labels:
    {{- include "docsie.labels" . | nindent 4 }}
    app.kubernetes.io/component: celery
spec:
  replicas: {{ .Values.celery.replicaCount }}
  {{- with .Values.celery.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "docsie.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: celery
  template:
    metadata:
      labels:
        {{- include "docsie.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: celery
    spec:
      enableServiceLinks: false
      serviceAccountName: {{ include "docsie.serviceAccountName" . }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- include "docsie.startupDependencies" . | nindent 6 }}
      containers:
        - name: docsie-celery
          image: {{ include "docsie.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.celery.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with include "docsie.workloadEnv" (dict "root" $ "component" .Values.celery) }}
          {{- . | nindent 10 }}
          {{- end }}
          envFrom:
            - secretRef:
                name: {{ include "docsie.secretName" . }}
            {{- if include "docsie.generatedSecretEnabled" . }}
            - secretRef:
                name: {{ include "docsie.generatedSecretName" . }}
            {{- end }}
            {{- with .Values.workload.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- include "docsie.configVolumeMounts" . | nindent 10 }}
          resources:
            {{- toYaml .Values.celery.resources | nindent 12 }}
      {{- include "docsie.configVolumes" . | nindent 6 }}
      {{- with .Values.celery.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.celery.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.celery.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
