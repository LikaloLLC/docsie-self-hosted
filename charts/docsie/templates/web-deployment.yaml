{{- if .Values.web.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: docsie-web
  labels:
    {{- include "docsie.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicaCount }}
  {{- with .Values.web.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "docsie.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        {{- include "docsie.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: web
    spec:
      enableServiceLinks: false
      serviceAccountName: {{ include "docsie.serviceAccountName" . }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- include "docsie.startupDependencies" . | nindent 6 }}
      containers:
        - name: docsie-web
          image: {{ include "docsie.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.web.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.web.port }}
          {{- with include "docsie.workloadEnv" (dict "root" $ "component" .Values.web) }}
          {{- . | nindent 10 }}
          {{- end }}
          envFrom:
            - secretRef:
                name: {{ include "docsie.secretName" . }}
            {{- if include "docsie.generatedSecretEnabled" . }}
            - secretRef:
                name: {{ include "docsie.generatedSecretName" . }}
            {{- end }}
            {{- with .Values.workload.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- include "docsie.configVolumeMounts" . | nindent 10 }}
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
      {{- include "docsie.configVolumes" . | nindent 6 }}
      {{- with .Values.web.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
