{{- if .Values.celeryBeat.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: docsie-celery-beat
  labels:
    {{- include "docsie.labels" . | nindent 4 }}
    app.kubernetes.io/component: celery-beat
spec:
  replicas: {{ .Values.celeryBeat.replicaCount }}
  selector:
    matchLabels:
      {{- include "docsie.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: celery-beat
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        {{- include "docsie.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: celery-beat
    spec:
      enableServiceLinks: false
      serviceAccountName: {{ include "docsie.serviceAccountName" . }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- include "docsie.startupDependencies" . | nindent 6 }}
      containers:
        - name: docsie-celery-beat
          image: {{ include "docsie.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.celeryBeat.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with include "docsie.workloadEnv" (dict "root" $ "component" .Values.celeryBeat) }}
          {{- . | nindent 10 }}
          {{- end }}
          envFrom:
            - secretRef:
                name: {{ include "docsie.secretName" . }}
            {{- if include "docsie.generatedSecretEnabled" . }}
            - secretRef:
                name: {{ include "docsie.generatedSecretName" . }}
            {{- end }}
            {{- with .Values.workload.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- include "docsie.configVolumeMounts" . | nindent 10 }}
          resources:
            {{- toYaml .Values.celeryBeat.resources | nindent 12 }}
      {{- include "docsie.configVolumes" . | nindent 6 }}
      {{- with .Values.celeryBeat.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.celeryBeat.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.celeryBeat.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
