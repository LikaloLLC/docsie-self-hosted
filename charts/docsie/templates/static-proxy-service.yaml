{{- if .Values.staticProxy.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "docsie.staticProxyName" . }}
  labels:
    {{- include "docsie.labels" . | nindent 4 }}
    app.kubernetes.io/component: static-proxy
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.staticProxy.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "docsie.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: static-proxy
{{- end }}
