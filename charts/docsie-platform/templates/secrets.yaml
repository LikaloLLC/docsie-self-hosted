{{- if eq .Values.storage.mode "local" }}
{{- /*
Platform secret generation — the single place credentials come from.

Both Secrets are produced in THIS one template so every generated value is
computed exactly once per render:

  docsie-platform-secrets  — primary credentials (DJANGO_SECRET_KEY,
                             FIELD_ENCRYPTION_KEY, POSTGRES_PASSWORD,
                             REDIS_PASSWORD, MINIO_ROOT_USER/PASSWORD)
  docsie-platform-derived  — connection strings built FROM those credentials
                             (DATABASE_URL, REDIS_URL, celery broker URLs,
                             S3 keys, Dokuta variants)

Rotation safety: values are looked up from the existing Secret first
(`lookup`-guarded), so `helm upgrade` never rotates credentials. Explicit
overrides via .Values.secrets.<KEY> win over both.
*/ -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace "docsie-platform-secrets" }}
{{- $existingData := dict }}
{{- if $existing }}{{- $existingData = $existing.data | default dict }}{{- end }}
{{- $overrides := .Values.secrets | default dict }}

{{- $vals := dict }}
{{- range $spec := list
      (dict "key" "DJANGO_SECRET_KEY" "len" 50)
      (dict "key" "FIELD_ENCRYPTION_KEY" "len" 0)
      (dict "key" "POSTGRES_PASSWORD" "len" 32)
      (dict "key" "REDIS_PASSWORD" "len" 32)
      (dict "key" "DOKUTA_SERVICE_API_KEY" "len" 48)
      (dict "key" "MINIO_ROOT_USER" "len" 20)
      (dict "key" "MINIO_ROOT_PASSWORD" "len" 32) }}
{{- $k := $spec.key }}
{{- $v := "" }}
{{- if get $overrides $k }}
{{- $v = get $overrides $k }}
{{- else if hasKey $existingData $k }}
{{- $v = get $existingData $k | b64dec }}
{{- else if eq $k "FIELD_ENCRYPTION_KEY" }}
{{- /* Fernet key: base64 of 32 bytes (alphanumeric source is URL-safe). */}}
{{- $v = randAlphaNum 32 | b64enc }}
{{- else }}
{{- $v = randAlphaNum (int $spec.len) }}
{{- end }}
{{- $_ := set $vals $k $v }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: docsie-platform-secrets
  labels:
    app.kubernetes.io/name: docsie-platform
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    # Keep the secret across `helm uninstall` so credentials survive
    # reinstalls against existing data volumes.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
{{- range $k, $v := $vals }}
  {{ $k }}: {{ $v | quote }}
{{- end }}
---
{{- $pg := get $vals "POSTGRES_PASSWORD" }}
{{- $redis := get $vals "REDIS_PASSWORD" }}
{{- $minioUser := get $vals "MINIO_ROOT_USER" }}
{{- $minioPass := get $vals "MINIO_ROOT_PASSWORD" }}
apiVersion: v1
kind: Secret
metadata:
  name: docsie-platform-derived
  labels:
    app.kubernetes.io/name: docsie-platform
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  # Docsie app (envFrom via docsie.workload.extraEnvFrom)
  DATABASE_URL: {{ printf "postgres://docsie:%s@postgresql:5432/docsie" $pg | quote }}
  REDIS_URL: {{ printf "redis://:%s@redis:6379" $redis | quote }}
  CELERY_BROKER_URL: {{ printf "redis://:%s@redis:6379/2" $redis | quote }}
  CELERY_RESULT_BACKEND: {{ printf "redis://:%s@redis:6379/2" $redis | quote }}
  AWS_ACCESS_KEY_ID: {{ $minioUser | quote }}
  AWS_SECRET_ACCESS_KEY: {{ $minioPass | quote }}
  DJANGO_AWS_ACCESS_KEY_ID: {{ $minioUser | quote }}
  DJANGO_AWS_SECRET_ACCESS_KEY: {{ $minioPass | quote }}
  {{- if .Values.profiles.full }}
  DOKUTA_API_URL: "http://dokuta-fastapi:8880/api/v1"
  DOKUTA_API_KEY: {{ get $vals "DOKUTA_SERVICE_API_KEY" | quote }}
  {{- end }}
  # Dokuta (per-key secretKeyRef from the dokuta/celery env maps)
  DOKUTA_POSTGRES_URI: {{ printf "postgresql://docsie:%s@postgresql:5432/dokuta" $pg | quote }}
  DOKUTA_REDIS_URL: {{ printf "redis://:%s@redis:6379/0" $redis | quote }}
  DOKUTA_CELERY_BROKER_URL: {{ printf "redis://:%s@redis:6379/0" $redis | quote }}

{{- end }}
