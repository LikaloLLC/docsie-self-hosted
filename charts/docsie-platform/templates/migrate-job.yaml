{{- if .Values.migrations.enabled }}
{{- $app := .Subcharts.docsie }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-migrate
  labels:
    app.kubernetes.io/name: docsie-migrate
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 1
  activeDeadlineSeconds: {{ .Values.migrations.timeoutSeconds }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: docsie-migrate
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      enableServiceLinks: false
      restartPolicy: Never
      serviceAccountName: {{ include "docsie.serviceAccountName" $app }}
      {{- with $app.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- include "docsie.startupDependencies" $app | nindent 6 }}
      containers:
        - name: migrate
          image: {{ include "docsie.image" $app | quote }}
          imagePullPolicy: {{ $app.Values.image.pullPolicy }}
          command: ["python", "manage.py", "migrate", "--noinput"]
          {{- include "docsie.workloadEnv" (dict "root" $app "component" dict) | nindent 10 }}
          envFrom:
            - secretRef:
                name: {{ include "docsie.secretName" $app }}
            {{- with $app.Values.workload.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- include "docsie.configVolumeMounts" $app | nindent 10 }}
          resources:
            {{- toYaml .Values.migrations.resources | nindent 12 }}
      {{- include "docsie.configVolumes" $app | nindent 6 }}
{{- end }}
