# Vendored from external/docsie-helm-charts/dokuta/chromadb for docsie-platform.
# Normalizations: tag pinned to 0.5.4; fullnameOverride fixed to "chromadb";
# PVC access mode ReadWriteOnce for single-node installs; tenant values
# overrides (values.prod/stage.yaml) not vendored.
# Default values for chromadb.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

kind: Deployment

strategy: {}
  # rollingUpdate:
  #   maxSurge: 1
  #   maxUnavailable: 1
  # type: RollingUpdate

image:
  repository: ghcr.io/chroma-core/chroma
  pullPolicy: IfNotPresent
  # Pinned explicitly (was empty -> appVersion). Digest-pin at bundle build.
  tag: "0.5.4"

env: 
  - name: ANONYMIZED_TELEMETRY
    value: "False"
  - name: ALLOW_RESET
    value: "True"
  - name: IS_PERSISTENT
    value: "True"

imagePullSecrets: []
nameOverride: ""
# Fixed same-namespace service name; other platform components reference
# "chromadb" directly.
fullnameOverride: "chromadb"

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 8000

serviceMonitor:
  # Enable the creation of a ServiceMonitor resource
  enabled: false
  # Specify the namespace the ServiceMonitor resource should be created in
  namespace: ""
  # Specify the interval at which metrics should be scraped
  interval: 30s
  # Specify the scrape timeout
  scrapeTimeout: 10s
  # path to scrape for metrics
  path: /metrics
  # additional labels to add to the ServiceMonitor
  additionalLabels: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

livenessProbe: {}
  # httpGet:
  #   path: /
  #   port: http
readinessProbe: {}
  # httpGet:
  #   path: /
  #   port: http

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}


pvc:
  enabled: true

  existingClaim: ""

  persistentVolumeClaim:
    ## Ref: http://kubernetes.io/docs/user-guide/persistent-volum
    accessModes:
      # Single-node on-prem default (local-path/Longhorn RWO); was ReadWriteMany.
      - ReadWriteOnce

    name: "db-data"

    labels: {}

    annotations: {}

    storageClassName: ""

    size: "2Gi"
