# Single-node PostgreSQL on the official image. Not exposed outside the cluster.
# Fixed same-namespace service name; other components reference "postgresql".
fullnameOverride: postgresql

image:
  repository: postgres
  # Official image, per the installer strategy decision. Digest-pin at bundle build.
  tag: 17-alpine
  pullPolicy: IfNotPresent

auth:
  # Superuser name; the password ALWAYS comes from a Kubernetes Secret —
  # no credential value ships in this chart.
  username: docsie
  existingSecret: docsie-platform-secrets
  passwordKey: POSTGRES_PASSWORD

# Databases created on first init (initdb scripts run only on an empty volume).
databases:
  - docsie
  - dokuta

service:
  port: 5432

persistence:
  enabled: true
  # Empty = fall back to global.storageClass, then the cluster default.
  storageClassName: ""
  size: 20Gi

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi

nodeSelector: {}
tolerations: []
affinity: {}
