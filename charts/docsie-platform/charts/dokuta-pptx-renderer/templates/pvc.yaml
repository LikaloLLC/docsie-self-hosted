{{- if .Values.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "dokuta-pptx-renderer.fullname" . }}-cache
  labels:
    {{- include "dokuta-pptx-renderer.labels" . | nindent 4 }}
spec:
  accessModes:
    {{- toYaml .Values.persistence.accessModes | nindent 4 }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
  {{- with (.Values.persistence.storageClassName | default ((.Values.global | default dict).storageClass | default "")) }}
  storageClassName: {{ . | quote }}
  {{- end }}
{{- end }}
