# Vendored from external/docsie-helm-charts/dokuta/on-prem/celery for docsie-platform.
# Normalizations: credentialed URLs consumed from the platform-generated secrets
# (docsie-platform-secrets / docsie-platform-derived); other config keys are read
# from dokuta-secret, whose endpoint keys are derived by the dokuta-onprem chart;
# customer-prefixed image tag replaced with a neutral release tag; workloads
# renamed celery -> dokuta-celery to avoid colliding with Docsie's own celery.
nameOverride: dokuta-celery
fullnameOverride: dokuta-celery

replicaCount: 2

image:
  repository: docsie/dokuta-celery
  # TODO(onprem-bundle): build/retag multi-arch as docsie/dokuta-celery:onprem-0.1.0
  tag: "onprem-0.1.0"
  pullPolicy: IfNotPresent

# Airgapped installs import images into containerd; no pull secret by default.
# global.imagePullSecret is appended automatically when set.
imagePullSecrets: []

service:
  type: ClusterIP
  port: 80

env:
  OPENAI_IMAGE_GENERATION_MODEL:
    secretName: dokuta-secret
    key: openaiimagegenerationmodel
  THEME_URL:
