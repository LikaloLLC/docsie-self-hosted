apiVersion: v1
kind: Service
metadata:
  name: {{ include "celery.fullname" . }}
  labels:
    {{- include "celery.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: dokuta-celery
    app.kubernetes.io/instance: dokuta-celery
