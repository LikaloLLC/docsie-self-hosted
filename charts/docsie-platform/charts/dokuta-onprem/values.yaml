llmEnv:
  enabled: true
  secretName: dokuta-secret
  optional: true

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

# Public URL of the Dokuta UI. Empty = https://dokuta.<global.hostname>
publicUrl: ""

ingress:
  enabled: true
  className: traefik
  annotations: {}
  hosts:
    # host empty = dokuta.<global.hostname>
    - host: ""
      paths:
        - path: /
          pathType: Prefix
  # TLS is customer-provided; when global.tls.mode=secret a tls block using
  # global.tls.secretName is added automatically by templates/ingress.yaml.
  tls: []

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: "2"
    memory: 3Gi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

volumes: []
volumeMounts: []
nodeSelector: {}
tolerations: []
affinity: {}
