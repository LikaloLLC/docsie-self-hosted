# Vendored from external/docsie-helm-charts/dokuta/on-prem/dokuta for docsie-platform.
# Normalizations applied while vendoring:
#   - namespace-qualified svc DNS -> same-namespace service names (redis, minio,
#     chromadb, docsie-web, collaboration-relay, dokuta-fastapi), derived in
#     templates/secret.yaml
#   - dokuta.local / model-host IPs -> global.hostname / global.modelEndpoint /
#     global.whisperEndpoint
#   - passwords and credentialed URLs -> docsie-platform-secrets /
#     docsie-platform-derived (generated by the umbrella chart)
#   - customer-prefixed image tags -> neutral onprem release tags
nameOverride: dokuta
fullnameOverride: dokuta

replicaCount: 1

image:
  repository: docsie/dokuta
  # TODO(onprem-bundle): build/retag multi-arch as docsie/dokuta:onprem-0.1.0
  tag: "onprem-0.1.0"
  pullPolicy: IfNotPresent

# Airgapped installs import images into containerd; no pull secret by default.
# global.imagePullSecret is appended automatically when set.
imagePullSecrets: []

service:
  type: ClusterIP
  port: 8501

fastapi:
  replicaCount: 1
  image:
    repository: docsie/dokuta-api
    # TODO(onprem-bundle): build/retag multi-arch as docsie/dokuta-api:onprem-0.1.0
    tag: "onprem-0.1.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8880
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 3Gi

secret:
  create: true
  name: dokuta-secret
  stringData:
    # NOTE: connection URLs, credentials, and public/base URLs are NOT set
    # here. They are derived in templates/secret.yaml from global values and
    # same-namespace service names, or consumed from the platform-generated
    # secrets (docsie-platform-secrets / docsie-platform-derived).
    openaiimagegenerationmodel: qwen3-vl:30b-a3b-thinking
    themeurl: ./theme.yaml
    redisport: "6379"
    redisdb: "0"
    hixaiapikey: local-disabled
    embeddingprovider: local
    apifyapitoken: local-disabled
    serpapikey: local-disabled
    chromadbport: "8000"
    chromadbtoken: local-chroma-token
    CHARGEBEE_API_KEY: local-disabled
    CHARGEBEE_SITE: local-disabled
    OPENAI_API_KEY: ollama-local-placeholder
    openaiapikey: ollama-local-placeholder
    supabaseurl: ""
    supabasekey: ""
    supabaseservicekey: ""
    authclientid: local-disabled
    authclientsecret: local-disabled
    authmanagmentclientid: local-disabled
    authmanagmentclientsecret: local-disabled
    authopenidconfendpoint: ""
    azureopenaiapikey: local-disabled
    azureopenaiendpoint: ""
    openaicompmodelname: qwen3:14b
    openaitranmodelname: large-v3-turbo
    MONGO_DB_HOST: ""
    MONGO_DB_PORT: "27017"
    MONGO_DB_USERNAME: ""
    MONGO_DB_PASSWORD: ""
    MONGO_DB_NAME: hr-dokuta
    MONGO_CALL_COLLECTION_NAME: calls
    mongohost: ""
    mongodbport: "27017"
    mongousername: ""
    mongopassword: ""
    mongodbname: hr-dokuta
    mongocallcollectionname: calls
    RECALL_TOKEN: local-disabled
    RECALL_API_KEY: local-disabled
    recalltoken: local-disabled
    FUSIONAUTH_API_KEY: local-disabled
    FUSIONAUTH_BASE_URL: ""
    FUSIONAUTH_CLIENT_ID: local-disabled
    FUSIONAUTH_CLIENT_SECRET: local-disabled
    fusionauthapikey: local-disabled
    fusionauthbaseurl: ""
    fusionauthclientid: local-disabled
    fusionauthclientsecret: local-disabled
    GOOGLE_GEMINI_API_KEY: local-disabled
    GOOGLE_VEO_MODEL_NAME: local-disabled
    DOCSIE_WEBHOOK_KEY: local-disabled
    PERSISTENCE_BACKEND: postgres
    STORAGE_BACKEND: s3
    S3_REGION: us-east-1
    S3_CREATE_BUCKET: "true"
    LLM_PROVIDER: ollama-local
    LLM_API_KEY: ollama-local-placeholder
    LLM_CHAT_MODEL: qwen3:14b
    LLM_FAST_MODEL: qwen3:8b
    LLM_JSON_MODEL: qwen3:14b
    LLM_VISION_MODEL: qwen3-vl:30b-a3b-thinking
    LLM_EMBEDDING_MODEL: qwen3-embedding:4b
    LLM_TRANSCRIPTION_PROVIDER: openai
    LLM_TRANSCRIPTION_API_KEY: local
    LLM_TRANSCRIPTION_MODEL: large-v3-turbo
    DOKUTA_ANNOTATION_LLM_PROVIDER: ollama-local
    DOKUTA_ANNOTATION_LLM_API_KEY: ollama-local-placeholder
    DOKUTA_ANNOTATION_LLM_VISION_MODEL: qwen3-vl:30b-a3b-thinking
    DOKUTA_API_STRICT_OPTIONAL_IMPORTS: "false"
    DOKUTA_ENABLE_REALTIME_API: "false"
    DOKUTA_ENABLE_AVATARS_API: "false"
    DOKUTA_ENABLE_VOICE_API: "false"
    DOKUTA_ENABLE_VOICE_AGENT_API: "false"
    DOKUTA_ENABLE_VOICE_LIVEKIT_API: "false"
    DOKUTA_ENABLE_TRANSCRIPTION_API: "true"
    SENTRY_DSN: ""
    SENTRY_ENVIRONMENT: onprem
    SENTRY_TRACES_SAMPLE_RATE: "0"
    SENTRY_PROFILES_SAMPLE_RATE: "0"

