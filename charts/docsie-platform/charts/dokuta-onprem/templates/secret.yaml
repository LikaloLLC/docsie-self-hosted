{{- if .Values.secret.create }}
{{- /*
Derived, non-credential endpoints. The whole platform installs into a single
namespace, so all in-cluster references use bare service names (never
namespace-qualified svc.cluster.local strings). Credentialed URLs (Redis,
Postgres, Celery broker, S3 keys) intentionally never appear here — workloads
consume them from docsie-platform-secrets / docsie-platform-derived, which are
generated by the umbrella chart.
*/}}
{{- $g := .Values.global | default dict }}
{{- $hostname := $g.hostname | default "docsie.example.com" }}
{{- $publicUrl := .Values.publicUrl | default (printf "%s://dokuta.%s" ($g.scheme | default "https") $hostname) }}
{{- $modelEndpoint := $g.modelEndpoint | default "http://ollama.example.com:11434/v1" }}
{{- $whisperEndpoint := $g.whisperEndpoint | default "http://whisper-openai-adapter:8080/v1" }}
{{- $derived := dict
  "redishost" "redis"
  "chromadbhost" "chromadb"
  "S3_ENDPOINT_URL" "http://minio:9000"
  "docsiegeneratetmpurl" "http://docsie-web/api_v2/003/files/generate_temp_url/"
  "docsieimportmdurl" "http://docsie-web/api_v2/003/files/import_md/"
  "docsieuploadurl" "http://docsie-web/api_v2/003/files/upload/"
  "SERVER_BASE_URL" "http://dokuta-fastapi:8880"
  "serverbaseurl" "http://dokuta-fastapi:8880"
  "API_SERVICE_DOMAIN" "http://dokuta-fastapi:8880"
  "apiservicedomain" "http://dokuta-fastapi:8880"
  "websocketrelay" "ws://collaboration-relay:8080/hub"
}}
{{- $_ := set $derived "authbaseurl" $publicUrl }}
{{- $_ := set $derived "authredirecturi" (printf "%s/auth/callback" $publicUrl) }}
{{- $_ := set $derived "FUSIONAUTH_REDIRECT_URI" (printf "%s/auth/callback" $publicUrl) }}
{{- $_ := set $derived "fusionauthredirecturi" (printf "%s/auth/callback" $publicUrl) }}
{{- $_ := set $derived "DOKUTA_PUBLIC_BASE_URL" $publicUrl }}
{{- $_ := set $derived "LLM_BASE_URL" $modelEndpoint }}
{{- $_ := set $derived "DOKUTA_ANNOTATION_LLM_BASE_URL" $modelEndpoint }}
{{- $_ := set $derived "LLM_TRANSCRIPTION_BASE_URL" $whisperEndpoint }}
{{- $tts := $g.chatterbox | default dict }}
{{- if or $tts.enabled $tts.externalUrl }}
{{- $_ := set $derived "DOKUTA_ENABLE_VOICE_API" "true" }}
{{- end }}
{{- $data := mergeOverwrite (deepCopy (.Values.secret.stringData | default dict)) $derived }}
{{- $data = mergeOverwrite $data (.Values.secret.extraStringData | default dict) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secret.name }}
  labels:
    {{- include "dokuta.labels" . | nindent 4 }}
type: Opaque
stringData:
{{- range $key, $value := $data }}
  {{ $key }}: {{ $value | quote }}
{{- end }}
{{- end }}
