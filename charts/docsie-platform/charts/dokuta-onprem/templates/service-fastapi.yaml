apiVersion: v1
kind: Service
metadata:
  name: dokuta-fastapi
  labels:
    app.kubernetes.io/name: dokuta-fastapi
    app.kubernetes.io/instance: dokuta
spec:
  type: {{ .Values.fastapi.service.type | default "ClusterIP" }}
  ports:
    - name: http
      port: {{ .Values.fastapi.service.port }}
      targetPort: http
  selector:
    app.kubernetes.io/name: dokuta-fastapi
    app.kubernetes.io/instance: dokuta
