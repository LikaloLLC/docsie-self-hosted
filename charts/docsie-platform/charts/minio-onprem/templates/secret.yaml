{{- /* Only created when no shared platform secret is used. No credential
     defaults are shipped: both values must be provided explicitly. */ -}}
{{- if not .Values.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.auth.secretName }}
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  {{ .Values.auth.userKey }}: {{ required "auth.rootUser is required when auth.existingSecret is empty" .Values.auth.rootUser | quote }}
  {{ .Values.auth.passwordKey }}: {{ required "auth.rootPassword is required when auth.existingSecret is empty" .Values.auth.rootPassword | quote }}
{{- end }}
