{{- if not .Values.secretEnv.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "whisper-openai-adapter.fullname" . }}-secret
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  {{- /* On-prem default: local Whisper backends need no real key. */}}
  GROQ_API_KEY: {{ .Values.secretEnv.values.GROQ_API_KEY | default "onprem-local-unused" | quote }}
  {{- if .Values.auth.enabled }}
  ADAPTER_API_TOKEN: {{ required "secretEnv.values.ADAPTER_API_TOKEN is required when auth.enabled=true and secretEnv.existingSecret is empty" .Values.secretEnv.values.ADAPTER_API_TOKEN | quote }}
  {{- end }}
{{- end }}
