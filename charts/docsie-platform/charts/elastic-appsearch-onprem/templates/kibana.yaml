{{- if .Values.kibana.enabled }}
apiVersion: kibana.k8s.elastic.co/v1
kind: Kibana
metadata:
  name: {{ .Values.kibana.name }}
spec:
  version: {{ .Values.kibana.version | quote }}
  count: {{ .Values.kibana.count }}
  elasticsearchRef:
    name: {{ .Values.elasticsearch.name }}
  enterpriseSearchRef:
    name: {{ .Values.enterpriseSearch.name }}
  config:
    server.publicBaseUrl: {{ .Values.kibana.publicBaseUrl | quote }}
    enterpriseSearch.ssl.verificationMode: none
  http:
    service:
      spec:
        type: ClusterIP
  podTemplate:
    spec:
      containers:
        - name: kibana
          resources:
            {{- toYaml .Values.kibana.resources | nindent 12 }}
{{- end }}

