# ECK operator and CRDs are vendored under charts/prerequisites.
# scripts/install-kubernetes.sh installs them before this chart.
elasticsearch:
  enabled: true
  name: production
  version: 8.12.0
  count: 1
  storage: 20Gi
  resources:
    requests:
      memory: 2Gi
      cpu: 500m
    limits:
      memory: 2Gi
      cpu: "1"

enterpriseSearch:
  enabled: true
  name: production
  version: 8.12.0
  count: 1
  # Empty = same-namespace ECK service URL https://<name>-ent-http:3002
  externalUrl: ""
  documentSizeLimit: 500kb
  sourceEnginesPerMetaEngineLimit: 500
  javaOpts: "-Xms2g -Xmx2g"
  resources:
    requests:
      memory: 2Gi
      cpu: 500m
    limits:
      memory: 3Gi
      cpu: "1"

kibana:
  enabled: false
  name: production
  version: 8.12.0
  count: 1
  publicBaseUrl: http://localhost:5601
  resources:
    requests:
      memory: 1Gi
      cpu: 250m
    limits:
      memory: 1Gi
      cpu: "1"


bootstrap:
  image: python:3.12.10-alpine3.21
  timeoutSeconds: 900

ingress:
  enabled: false
  className: nginx
  # A browser-trusted certificate for search.<global.hostname>.
  tlsSecretName: ""
