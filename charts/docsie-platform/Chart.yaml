apiVersion: v2
name: docsie-platform
description: >-
  Umbrella chart for the Docsie on-prem / airgapped platform. Composes the
  Docsie app chart plus vendored, normalized on-prem subcharts behind three
  profiles (kb, kb-ai, full). See docs/ONPREM_INSTALLER_DESIGN.md §3.
type: application
version: 0.2.0-preview.5
appVersion: "onprem-0.1.0"

dependencies:
  # Exact application chart version; bundled when packaging the release.
  - name: docsie
    version: "0.3.0-preview.2"
    repository: "file://../docsie"

  # ---- kb profile (baseline platform, always on unless explicitly disabled)
  - name: postgresql-local
    version: 0.1.0
    condition: storage.postgresql.enabled
  - name: redis-local
    version: 0.1.0
    condition: storage.redis.enabled
  - name: minio-onprem
    version: 0.1.0
    condition: storage.minio.enabled
  - name: elasticsearch-onprem
    version: 0.1.0
    condition: profiles.kb
  - name: image-processor
    version: 0.1.1
  - name: pdf-converter
    version: 0.1.0

  # Search is a baseline requirement. The installer provisions the vendored ECK operator.
  - name: elastic-appsearch-onprem
    version: 0.1.1
    condition: global.appSearch.enabled

  # ---- full profile (video-to-docs pipeline and satellites)
  - name: dokuta-onprem
    version: 0.1.1
    condition: profiles.full
  - name: dokuta-celery-onprem
    version: 0.1.1
    condition: profiles.full
  - name: chromadb
    version: 0.1.4
    condition: profiles.full
  - name: whisper-openai-adapter
    version: 0.1.0
    condition: profiles.full
  - name: glmocr-pipeline
    version: 0.1.0
    condition: profiles.full
  - name: collaboration-relay
    version: 0.1.0
    condition: profiles.full
  - name: dokuta-pptx-renderer
    version: 0.1.0
    condition: profiles.full

  # Optional even within the full profile (design doc: "CAD adapter (optional)")
  - name: cad-adapter
    version: 0.1.0
    condition: cadAdapter.enabled

  # Optional speech output; does not enable media calls or meeting capture.
  - name: chatterbox-tts
    version: 0.1.0
    condition: global.chatterbox.enabled
