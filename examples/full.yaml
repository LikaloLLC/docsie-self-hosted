# Full-stack configuration template. Image publication/licensing and audio
# acceptance remain pending; run image preflight before attempting installation.
profiles:
  kb: true
  kbAi: false
  full: true
global:
  modelEndpoint: http://YOUR_MODEL_HOST:11434/v1
  whisperEndpoint: http://whisper-openai-adapter:8080/v1
docsie:
  plainEnv:
    # Explicit value also causes existing application pods to roll when
    # upgrading from the KB-only profile. API key is generated by the platform.
    DOKUTA_API_URL: http://dokuta-fastapi:8880/api/v1
dokuta-onprem:
  # Keep external access off until identity-provider settings are validated.
  ingress:
    enabled: false
  secret:
    extraStringData:
      # Multi-frame inference on a local model may exceed the 120s app default.
      LLM_TIMEOUT_SECONDS: "600"
      LLM_CHAT_MODEL: YOUR_CHAT_MODEL
      LLM_FAST_MODEL: YOUR_CHAT_MODEL
      LLM_JSON_MODEL: YOUR_CHAT_MODEL
      LLM_VISION_MODEL: YOUR_VISION_MODEL
      DOKUTA_ANNOTATION_LLM_VISION_MODEL: YOUR_VISION_MODEL
      LLM_EMBEDDING_MODEL: YOUR_EMBEDDING_MODEL
whisper-openai-adapter:
  env:
    GROQ_BASE_URL: http://YOUR_TRANSCRIPTION_HOST:8000/v1
    WHISPER_MODEL: YOUR_TRANSCRIPTION_MODEL
glmocr-pipeline:
  image:
    repository: docsie/glmocr-pipeline
    tag: helm-local # Local build only; replace with a published, audited release.
  env:
    GLMOCR_MODEL: YOUR_VISION_MODEL
