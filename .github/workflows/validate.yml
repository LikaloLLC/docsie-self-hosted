name: Validate and package distribution
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.17.3
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6
      - run: python -m pip install -r requirements-dev.txt
      - run: bash scripts/package-release.sh
      - run: terraform -chdir=installers/aws/terraform init -backend=false -input=false
      - run: terraform -chdir=installers/aws/terraform validate
      - run: terraform -chdir=installers/aws/terraform fmt -check
      - uses: actions/upload-artifact@v4
        with:
          name: public-charts
          path: dist/
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: public-charts
          path: dist/
      - name: Publish development preview
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/* --prerelease --verify-tag \
            --title "Docsie Self-Hosted $RELEASE_TAG" --notes-file docs/RELEASE_STATUS.md
